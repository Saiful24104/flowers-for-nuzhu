<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Nuzhu ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle, #10182b 0%, #02050a 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Opening Screen to allow audio to play */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #02050a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
            cursor: pointer;
            transition: opacity 1s ease-in-out;
        }

        #start-screen h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(255, 77, 109, 0.8);
        }

        #start-screen p {
            font-size: 1.2rem;
            color: #adb5bd;
            animation: pulse-text 2s infinite alternate;
        }

        @keyframes pulse-text {
            0% { opacity: 0.5; }
            100% { opacity: 1; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
        }

        /* Magical glowing fireflies/stars */
        .sparkles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background-image: 
                radial-gradient(circle, #fff 1.5px, transparent 1.5px),
                radial-gradient(circle, #90e0ef 2px, transparent 2px),
                radial-gradient(circle, #ffb3c6 1.5px, transparent 1.5px);
            background-size: 450px 450px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 100px 120px;
            opacity: 0.4;
            animation: twinkle 4s linear infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: translateY(0px); }
            100% { opacity: 0.6; transform: translateY(-15px); }
        }

        /* Flower Garden Container */
        .flower-container {
            position: relative;
            width: 450px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-bottom: 50px;
        }

        /* The Flower Structure */
        .flower {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: bottom center;
            animation: sway 4s ease-in-out infinite alternate;
        }

        /* Center main flower (Pink) */
        .flower-1 { animation-delay: 0s; z-index: 3; }

        /* Left flower (Blue) */
        .flower-2 { transform: scale(0.85) rotate(-20deg); left: 30px; animation-delay: -1.5s; z-index: 1; }

        /* Right flower (White) */
        .flower-3 { transform: scale(0.85) rotate(20deg); right: 30px; animation-delay: -2.5s; z-index: 2; }

        /* Blossom Center and Petals */
        .blossom { position: relative; width: 60px; height: 60px; }

        .center {
            position: absolute; width: 26px; height: 26px; background: #ffdb4d;
            border-radius: 50%; top: 17px; left: 17px; z-index: 5; box-shadow: 0 0 15px #ffdb4d;
        }

        .petal {
            position: absolute; border-radius: 50% 50% 0 0; width: 26px; height: 48px;
            left: 17px; transform-origin: bottom center;
        }

        /* Specific Colors for Nuzhu */
        .petal.pink { background: linear-gradient(to top, #ff4d6d, #ffb3c6); box-shadow: 0 0 15px rgba(255, 77, 109, 0.4); }
        .petal.blue { background: linear-gradient(to top, #0077b6, #90e0ef); box-shadow: 0 0 15px rgba(0, 119, 182, 0.4); }
        .petal.white { background: linear-gradient(to top, #adb5bd, #ffffff); box-shadow: 0 0 15px rgba(255, 255, 255, 0.5); }

        .petal-1 { transform: rotate(0deg); } .petal-2 { transform: rotate(60deg); }
        .petal-3 { transform: rotate(120deg); } .petal-4 { transform: rotate(180deg); }
        .petal-5 { transform: rotate(240deg); } .petal-6 { transform: rotate(300deg); }

        /* Stems */
        .stem {
            width: 7px; height: 260px; background: linear-gradient(to bottom, #2d6a4f, #081c15);
            border-radius: 4px; box-shadow: inset 2px 0 3px rgba(255,255,255,0.1);
        }

        /* Leaves */
        .leaf {
            position: absolute; width: 40px; height: 25px; background: linear-gradient(to right, #2d6a4f, #1b4332);
            border-radius: 0 100% 0 100%; top: 130px; left: -32px; transform: rotate(-15deg);
        }
        .leaf.right { border-radius: 100% 0 100% 0; left: 5px; transform: rotate(15deg); top: 170px; }

        /* Messages / Love Notes */
        .message-box {
            position: absolute; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 20px; border-radius: 20px; color: #fff; font-size: 0.9rem; white-space: nowrap;
            backdrop-filter: blur(8px); box-shadow: 0 4px 15px rgba(0,0,0,0.5); animation: float 3s ease-in-out infinite alternate; z-index: 10;
        }

        .msg-1 { top: 5%; left: -50%; animation-delay: 0s; border-color: rgba(144, 224, 239, 0.4); } 
        .msg-2 { top: 30%; left: -65%; animation-delay: -0.7s; }
        .msg-3 { top: 10%; right: -45%; animation-delay: -1.3s; border-color: rgba(255, 255, 255, 0.4); } 
        .msg-4 { top: 40%; right: -60%; animation-delay: -2s; }
        
        .msg-center { 
            bottom: 8%; left: 50%; transform: translateX(-50%); font-size: 1.1rem; font-weight: bold;
            background: rgba(255, 77, 109, 0.2); border-color: rgba(255, 117, 143, 0.6);
            animation: pulse-float 4s ease-in-out infinite alternate; 
        }

        /* Animations */
        @keyframes sway { 0% { transform: rotate(-3deg); } 100% { transform: rotate(3deg); } }
        @keyframes float { 0% { transform: translateY(0px); } 100% { transform: translateY(-12px); } }
        @keyframes pulse-float {
            0% { transform: translateX(-50%) translateY(0px) scale(1); box-shadow: 0 4px 15px rgba(255,77,109,0.3); }
            100% { transform: translateX(-50%) translateY(-10px) scale(1.05); box-shadow: 0 4px 25px rgba(255,77,109,0.6); }
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <div id="start-screen">
        <h1>For Nuzhu 💌</h1>
        <p>Tap anywhere to open your gift...</p>
    </div>

    <div class="sparkles"></div>

    <div class="flower-container">
        
        <div class="message-box msg-1">Nuzhu, you are the best thing in my life 💙</div>
        <div class="message-box msg-2">I love you more than words can say ✨</div>
        <div class="message-box msg-3">My beautiful girl 🤍</div>
        <div class="message-box msg-4">I coded these just for you 🩷</div>
        <div class="message-box msg-center">Forever yours, Nuzhu ❤️</div>

        <div class="flower flower-2">
            <div class="blossom">
                <div class="center"></div>
                <div class="petal blue petal-1"></div>
                <div class="petal blue petal-2"></div>
                <div class="petal blue petal-3"></div>
                <div class="petal blue petal-4"></div>
                <div class="petal blue petal-5"></div>
                <div class="petal blue petal-6"></div>
            </div>
            <div class="stem"></div>
            <div class="leaf"></div>
            <div class="leaf right"></div>
        </div>

        <div class="flower flower-3">
            <div class="blossom">
                <div class="center"></div>
                <div class="petal white petal-1"></div>
                <div class="petal white petal-2"></div>
                <div class="petal white petal-3"></div>
                <div class="petal white petal-4"></div>
                <div class="petal white petal-5"></div>
                <div class="petal white petal-6"></div>
            </div>
            <div class="stem"></div>
            <div class="leaf"></div>
            <div class="leaf right"></div>
        </div>

        <div class="flower flower-1">
            <div class="blossom">
                <div class="center"></div>
                <div class="petal pink petal-1"></div>
                <div class="petal pink petal-2"></div>
                <div class="petal pink petal-3"></div>
                <div class="petal pink petal-4"></div>
                <div class="petal pink petal-5"></div>
                <div class="petal pink petal-6"></div>
            </div>
            <div class="stem"></div>
            <div class="leaf"></div>
            <div class="leaf right"></div>
        </div>

    </div>

    <script>
        document.getElementById('start-screen').addEventListener('click', function() {
            // Fade out the opening screen
            this.style.opacity = '0';
            
            // Remove it from the view completely after 1 second
            setTimeout(() => {
                this.style.display = 'none';
            }, 1000);
            
            // Play the song!
            document.getElementById('bg-music').play();
        });
    </script>

</body>
</html>
